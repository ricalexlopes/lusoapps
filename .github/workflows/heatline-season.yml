name: Heatline season data
on:
  schedule:
    - cron: "23 4 * * *"
    - cron: "41 20 * * 6,0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/season.py POR ESP
      - name: Commit if changed
        run: |
          git add heatline/data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git -c user.name="heatline-bot" -c user.email="actions@users.noreply.github.com" commit -m "Heatline: update season data"
          git push
