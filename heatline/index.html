<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B3D63">
<title>Heatline · Swim results live</title>
<meta name="description" content="Follow your swimmer's events and results live, with an alert on every new time.">
<link rel="manifest" href="/heatline/manifest.json">
<link rel="icon" href="/heatline/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/heatline/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heatline">
<style>
:root{
  --bg:#EEF3F8; --card:#fff; --ink:#0E1B29; --muted:#5A6A7B; --line:#D8E2EC;
  --pool:#0B3D63; --pool-2:#1C6FA8; --soft:#E3EEF8; --on:#fff; --accent:#FF7A3D;
  --ok:#0F7F59; --ok-soft:#DDF2E8; --bad:#B3322B; --bad-soft:#F8E3E1; --warn:#9A5B00; --warn-soft:#FFF0D3;
  --r:16px; color-scheme:light;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#08121C; --card:#101E2B; --ink:#E6EEF6; --muted:#97A8B9; --line:#223548;
  --pool:#5AAEEA; --pool-2:#86C6F2; --soft:#132A3E; --on:#06111B;
  --ok:#4FD1A0; --ok-soft:#10302A; --bad:#FF8A80; --bad-soft:#3A1C1B; --warn:#F2B04A; --warn-soft:#33260F; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
header{background:linear-gradient(155deg,#0B3D63,#1C6FA8);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 0 16px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,#FF7A3D 0 16px,#fff 16px 32px);opacity:.9}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;border-radius:10px}
.brand b{font-size:21px;letter-spacing:-.01em}
.brand span{display:block;font-size:13px;opacity:.85;font-weight:500}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hbtn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:8px 12px;min-height:40px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
main{display:grid;gap:14px;padding:16px 0 calc(110px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{margin:0 0 6px;font-size:18px;letter-spacing:-.01em}
.muted{color:var(--muted)} .small{font-size:13.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search],input[type=url],textarea,select{width:100%;font-size:16px;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pool-2)}
textarea{min-height:120px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 16px;min-height:48px;font-weight:700;font-size:15.5px;background:var(--pool);color:var(--on);cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--pool)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.6}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--pool);font-size:13px;font-weight:700}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.6}
.chip.live{background:#DDF7E9;color:#0B7A4F} .chip.live .dot{opacity:1;animation:p 1.6s infinite}
@media (prefers-color-scheme:dark){.chip.live{background:#10302A;color:#4FD1A0}}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(15,180,110,.6)}70%{box-shadow:0 0 0 8px rgba(15,180,110,0)}100%{box-shadow:0 0 0 0 rgba(15,180,110,0)}}
.steps{counter-reset:s;display:grid;gap:14px}
.step h3{margin:0 0 8px;font-size:15.5px}
.step h3::before{counter-increment:s;content:counter(s);display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pool);color:var(--on);font-size:13px;margin-right:8px}
.list{display:grid;gap:8px;margin-top:10px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;cursor:pointer;min-height:56px}
.pick b{display:block}
.pick .plus{flex:none;width:34px;height:34px;border-radius:50%;background:var(--pool);color:var(--on);display:grid;place-items:center;font-size:22px;line-height:1}
.pick.on{border-color:var(--ok)} .pick.on .plus{background:var(--ok)}
.sw-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sw-h h2{margin:0}
.x{border:0;background:transparent;color:var(--muted);font-size:13.5px;cursor:pointer;padding:6px;text-decoration:underline}
.ev{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-of-type{margin-top:8px}
.ev .nm{font-weight:700}
.ev .when{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .t{font:800 22px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;font-variant-numeric:tabular-nums}
.ev .tw{text-align:right;font-size:13px;color:var(--muted)}
.ev .sub{grid-column:1/-1;font-size:13.5px;color:var(--muted)}
.ev.new{animation:flash 2.4s ease}
@keyframes flash{0%{background:var(--warn-soft)}100%{background:transparent}}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12.5px;font-weight:800;vertical-align:1px}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-bad{background:var(--bad-soft);color:var(--bad)} .b-soft{background:var(--soft);color:var(--pool)} .b-warn{background:var(--warn-soft);color:var(--warn)}
.gain{color:var(--ok);font-weight:700} .loss{color:var(--muted)}
details{grid-column:1/-1} details summary{cursor:pointer;color:var(--pool);font-weight:600;font-size:13.5px;padding:4px 0}
.spl{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.dock .wrap{display:flex;gap:8px}
.dock .btn{flex:1;min-height:48px;padding:10px 8px;font-size:14.5px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,25,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 8px;font-size:19px}
.sheet ol{padding-left:22px;margin:8px 0} .sheet li{margin:6px 0}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:14px 16px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:40}
.err{color:var(--bad);font-size:14px}
nav.tabs{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;gap:6px;padding:10px 0 2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14.5px;min-height:42px;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--pool);border-color:var(--pool);color:var(--on)}
section{display:grid;gap:14px}
.tbl{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
th,td{padding:8px 5px;vertical-align:top;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.near{color:var(--warn);font-weight:700}
.pb{background:var(--ok);color:#fff;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:800;margin-left:6px;vertical-align:2px}
.mh{font-size:15px;margin:14px 0 2px} .mh:first-child{margin-top:4px}
.cal{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:start}
.cal .d{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:64px}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);padding:8px 12px;font-weight:700;font-size:14px;min-height:40px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--pool);color:var(--on)}
.foot{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 8px}
.foot a{color:inherit}
</style>
</head>
<body>
<header>
  <div class="wrap hrow">
    <div class="brand"><img src="/heatline/icon.svg" alt=""><div><b>Heatline</b><span data-t="tag"></span></div></div>
    <button class="hbtn" id="langBtn" type="button" aria-label="Language">PT</button>
  </div>
</header>

<div class="wrap">
<nav class="tabs" role="tablist" id="tabs">
  <button role="tab" data-tab="live" aria-selected="true" data-t="tLive"></button>
  <button role="tab" data-tab="res" aria-selected="false" data-t="tRes"></button>
  <button role="tab" data-tab="min" aria-selected="false" data-t="tMin"></button>
  <button role="tab" data-tab="cal" aria-selected="false" data-t="tCal"></button>
</nav>
<main id="main">
<section id="tab-live">

  <!-- the meet -->
  <div class="card" id="meetCard">
    <div class="sw-h">
      <div><h2 id="meetName">…</h2><div class="small muted" id="meetWhere"></div></div>
      <span class="chip" id="chip"><span class="dot"></span><span id="chipTxt"></span></span>
    </div>
    <p class="small muted" id="meetNote" style="margin:10px 0 0"></p>
    <div class="row" style="margin-top:12px">
      <button class="btn ghost small" id="refreshBtn" type="button" data-t="refresh"></button>
      <button class="btn ghost small" id="notifBtn" type="button" data-t="alertsOn"></button>
      <button class="btn ghost small" id="meetBtn" type="button" data-t="changeMeet"></button>
    </div>
    <p class="small muted" id="lastTxt" style="margin:8px 0 0"></p>
  </div>

  <!-- choose / add a swimmer -->
  <div class="card" id="addCard">
    <div class="steps">
      <div class="step" id="stepMeet">
        <h3 data-t="s1"></h3>
        <div class="list" id="meetList"></div>
        <form id="linkForm" style="margin-top:10px">
          <label class="small muted" for="linkIn" data-t="pasteLink"></label>
          <div class="row" style="flex-wrap:nowrap;margin-top:6px"><input type="url" id="linkIn" inputmode="url" placeholder="https://live.swimrankings.net/…" autocomplete="off"><button class="btn small" type="submit">OK</button></div>
          <p class="err" id="linkErr" hidden></p>
        </form>
      </div>
      <div class="step" id="stepSwim">
        <h3 data-t="s2"></h3>
        <input type="search" id="q" autocomplete="off" autocapitalize="words" spellcheck="false">
        <p class="small muted" id="qHint" style="margin:6px 0 0"></p>
        <div class="list" id="qList"></div>
      </div>
    </div>
    <div class="row" style="margin-top:14px" id="doneRow" hidden><button class="btn" id="doneBtn" type="button" style="flex:1" data-t="done"></button></div>
  </div>

  <div id="swimmers" style="display:grid;gap:14px"></div>
</section>
<section id="tab-res" hidden><div id="resBox" style="display:grid;gap:14px"></div></section>
<section id="tab-min" hidden><div id="minBox" style="display:grid;gap:14px"></div></section>
<section id="tab-cal" hidden>
  <div class="card"><div class="sw-h"><h2 data-t="calTitle"></h2><div class="seg" id="natSeg"><button data-nat="POR">PT</button><button data-nat="ESP">ES</button></div></div>
  <p class="small muted" data-t="calNote" style="margin:6px 0 10px"></p><div class="cal" id="calList"></div></div>
  <div class="card" id="champCard" hidden><h2 data-t="champTitle"></h2><p class="small muted" id="champNote" style="margin:6px 0 10px"></p><div class="cal" id="champList"></div></div>
</section>

  <p class="foot"><span data-t="data"></span> <a href="https://live.swimrankings.net/" target="_blank" rel="noopener">live.swimrankings.net</a> · <span data-t="notAff"></span><br><span data-t="privacy"></span> <a href="/privacy/" data-t="privLink"></a> · Heatline by <a href="/">LusoApps</a> · v0.10</p>
</main></div>

<nav class="dock"><div class="wrap">
  <button class="btn ghost" id="addBtn" type="button" data-t="addSwimmer"></button>
  <button class="btn ghost" id="fbBtn" type="button" data-t="feedback"></button>
  <button class="btn" id="installBtn" type="button" data-t="install"></button>
</div></nav>

<!-- sheets -->
<div class="sheet-bg" id="fbSheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fbT">
  <h2 id="fbT" data-t="fbTitle"></h2>
  <p class="small muted" data-t="fbText" style="margin-top:0"></p>
  <textarea id="fbIn"></textarea>
  <div class="row" style="margin-top:12px"><button class="btn" id="fbSend" type="button" style="flex:1" data-t="send"></button><button class="btn ghost" type="button" data-close data-t="close"></button></div>
  <p class="small muted" style="margin:10px 0 0"><span data-t="orEmail"></span> <a href="mailto:hello@lusoapps.com">hello@lusoapps.com</a></p>
</div></div>

<div class="sheet-bg" id="instSheet" hidden><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="inT">
  <h2 id="inT" data-t="install"></h2>
  <div id="instIOS"><p class="muted" data-t="iosIntro" style="margin-top:0"></p><ol><li data-t="ios1"></li><li data-t="ios2"></li><li data-t="ios3"></li></ol></div>
  <div id="instOther"><p class="muted" data-t="andIntro" style="margin-top:0"></p><ol><li data-t="and1"></li><li data-t="and2"></li></ol></div>
  <button class="btn ghost" type="button" data-close data-t="close" style="width:100%;margin-top:8px"></button>
</div></div>

<div class="toast" id="toast" hidden role="status"></div>

// ---------- data ----------
function load(){
  if(!swimmers.length && DATA) { render(); return Promise.resolve(); }
  var lic=swimmers.map(function(s){return s.lic}).join(",");
  return fetch("/heatline/api/meet?id="+encodeURIComponent(meetId)+"&lic="+encodeURIComponent(lic),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
    var first=!DATA||DATA.id!==j.id; var prev=DATA; DATA=j; lastOk=Date.now();
    var m=curMeet(); if(m && j.meet && j.meet.name && (!m.name||m.city!==j.meet.city||(j.meet.date&&m.date!==j.meet.date))){m.name=j.meet.name;m.city=j.meet.city;if(j.meet.date)m.date=j.meet.date;LS.set("meets",meets)}
    var ch=false; swimmers.forEach(function(s){var S=j.swimmers&&j.swimmers[s.lic]; if(S&&S.found){ if(!s.g&&S.g){s.g=S.g;ch=true} if(!s.year&&S.year){s.year=S.year;ch=true} if(!s.grp&&S.grp){s.grp=S.grp;ch=true} }}); if(ch) LS.set("swimmers",swimmers);
    announce(first);
    render(); renderRes(); renderMin(); schedule();
  }).catch(function(){ $("lastTxt").textContent=t("noConn"); schedule(); });
}
function isLive(){ if(!DATA) return false; var m=curMeet()||{}; if(DATA.available) return DATA.meet.status!=="OFFICIAL"; return (m.date||DATA.meet.date)===today(); }

// New results since last time -> toast + notification.
function rkey(lic,r){return meetId+"|"+lic+"|"+r.n+"|"+(r.relay?"R"+r.leg:"I")+"|"+(r.time||r.st)}
var fresh={};
function announce(first){
  // the first time a swimmer is loaded for a meet, the results already there are not news
  var seen=LS.get("seen",{}), msgs=[];
  Object.keys(DATA.swimmers||{}).forEach(function(lic){ var S=DATA.swimmers[lic], ik=meetId+"|"+lic+"|init", init=!seen[ik]; seen[ik]=1;
    (S.results||[]).forEach(function(r){ var k=rkey(lic,r); if(!seen[k]){ seen[k]=1; if(!init){ fresh[k]=1; msgs.push(resMsg(S,r)); } } }); });
  LS.set("seen",seen);
  msgs.forEach(function(m,i){ setTimeout(function(){ toast(m); notify(m); }, i*2500); });
}
function resMsg(S,r){
  var e=(DATA.events||{})[r.n], who=(S.name||"").split(" ")[0];
  var txt=who+" · "+evName(e)+": "+(r.st?stTxt(r.st):fmt(r.time));
  if(r.place && !r.st) txt+=" · "+t("ord")(r.place)+" "+t("place");
  var g=gainOf(S,r); if(g>0) txt+=" · −"+g.toFixed(2)+" s";
  if(!r.relay&&!r.st&&r.time){ var lic=Object.keys(DATA.swimmers).find(function(k){return DATA.swimmers[k]===S}); var e2=(DATA.events||{})[r.n]||{}, pool=DATA.meet.pool;
    var prev=allRes(lic).filter(function(x){return !x.relay&&!x.st&&x.time&&x.ev.s===e2.s&&x.ev.d===e2.d&&x.pool===pool&&!(x.meetId===DATA.id&&x.n===r.n)});
    if(prev.length && prev.every(function(x){return x.time>r.time})) txt+=" · "+t("rpNew"); }
  return txt;
}
function stTxt(st){return st==="DSQ"?t("dsq"):st==="DNS"||st==="WDR"?t("dns"):st==="DNF"?t("dnf"):st}
function entryOf(S,r){ var en=(S.entries||[]).find(function(x){return x.n===r.n}); var et=r.et!=null?r.et:(en&&en.et), ep=r.ep||(en&&en.ep); return {et:et,ep:ep}; }
function gainOf(S,r){ if(r.relay||r.st||!r.time) return 0; var E=entryOf(S,r), pool=DATA.meet.pool||""; if(!E.et||(E.ep&&pool&&E.ep!==pool)) return 0; return Math.round((E.et-r.time)*100)/100; }

// ---------- render ----------
function render(){
  var m=curMeet()||{}, M=(DATA&&DATA.meet)||{};
  $("meetName").textContent=M.name||m.name||(t("event")+" "+meetId);
  $("meetWhere").textContent=[M.city||m.city, dLong(M.date||m.date)].filter(Boolean).join(" · ");
  var live=isLive(), chip=$("chip");
  chip.classList.toggle("live",!!(DATA&&DATA.available&&live));
  $("chipTxt").textContent=!DATA?"…":DATA.available?(M.status==="OFFICIAL"?t("official"):t("liveNow")):t("soon");
  $("meetNote").textContent=!DATA?"":DATA.available?(M.status==="OFFICIAL"?t("noteOff"):t("noteLive")):t("noteSoon");
  if(lastOk) $("lastTxt").textContent=t("last")+": "+new Date(lastOk).toLocaleTimeString(LOC[lang],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
  var html="";
  swimmers.forEach(function(s){
    var S=DATA&&DATA.swimmers&&DATA.swimmers[s.lic];
    html+="<div class='card'><div class='sw-h'><div><h2>"+esc(s.name)+"</h2><div class='small muted'>"+esc([s.year?t("born")+" "+s.year:"",s.club].filter(Boolean).join(" · "))+"</div></div><button class='x' type='button' data-rm='"+esc(s.lic)+"'>"+esc(t("remove"))+"</button></div>";
    if(!DATA) html+="<p class='muted'>…</p>";
    else if(!S||!S.found) html+="<p class='muted small' style='margin:10px 0 0'>"+esc(t("notFound"))+"</p>";
    else html+=eventsHtml(s.lic,S);
    html+="</div>";
  });
  if(!swimmers.length && !adding) html="<div class='card'><p class='muted' style='margin:0'>"+esc(t("pickSw"))+"</p></div>";
  $("swimmers").innerHTML=html;
}
function eventsHtml(lic,S){
  var E=DATA.events||{}, rows={};
  (S.entries||[]).forEach(function(x){ rows[x.n]={n:x.n,en:x,res:[]}; });
  (S.results||[]).forEach(function(r){ var k=r.relay?r.n+"R":String(r.n); rows[k]=rows[k]||{n:r.n,res:[]}; rows[k].res.push(r); });
  var merged=rows;
  return Object.keys(merged).map(function(k){return merged[k]}).sort(function(a,b){return a.n-b.n}).map(function(x){
    var e=E[x.n]||{}, r=x.res[0], when=[e.time||"", t("event")+" "+x.n].filter(Boolean).join(" · ");
    var title=r&&r.relay?(t("relay")+" "+evName(e)):evName(e);
    var right="", sub=[];
    if(r){
      right=r.st?"<span class='badge b-bad'>"+esc(stTxt(r.st))+"</span>":"<div class='t'>"+fmt(r.time)+"</div>";
      if(r.place&&!r.st) right+="<div class='tw'>"+esc(t("ord")(r.place))+" "+esc(t("place"))+"</div>";
      if(r.heat) sub.push(t("heat")+" "+r.heat+(r.lane?" · "+t("lane")+" "+r.lane:""));
      if(r.relay){ sub.push((r.team||"")+" · "+r.leg+".º "+t("leg")+(r.legTime?": "+fmt(r.legTime):"")); }
      else { var en=entryOf(S,r); if(en.et) sub.push(t("entry")+" "+fmt(en.et)+(en.ep?" ("+en.ep+")":"")); var g=gainOf(S,r); if(g>0) sub.push("<span class='gain'>−"+g.toFixed(2)+" s · "+esc(t("better"))+"</span>"); }
      if(r.pts) sub.push(r.pts+" "+t("pts"));
    } else {
      var en2=x.en||{}; right="<div class='tw'>"+(en2.et?esc(t("entry"))+"<br><b style='font-size:15px;color:var(--ink)'>"+fmt(en2.et)+"</b>"+(en2.ep?" <span class='small'>"+en2.ep+"</span>":""):esc(t("noEntry")))+"</div>";
      if(en2.x) sub.push("<span class='badge b-soft'>"+esc(t("extra"))+"</span>");
    }
    var sp=r&&r.splits&&r.splits.length?"<details><summary>"+esc(t("splits"))+"</summary><div class='spl'>"+r.splits.map(function(s,i,a){var lap=s.t-(i?a[i-1].t:0);return s.d+" m: "+fmt(s.t)+" ("+fmt(lap)+")"}).join("<br>")+(r.time?"<br>"+e.d*(e.rc||1)+" m: "+fmt(r.time)+" ("+fmt(r.time-r.splits[r.splits.length-1].t)+")":"")+"</div></details>":"";
    var isNew=r&&fresh[rkey(lic,r)];
    return "<div class='ev"+(isNew?" new":"")+"'><div><div class='nm'>"+esc(title)+"</div><div class='when'>"+esc(when)+"</div></div><div>"+right+"</div>"+(sub.length?"<div class='sub'>"+sub.join(" · ")+"</div>":"")+sp+"</div>";
  }).join("");
}

if("serviceWorker" in navigator) navigator.serviceWorker.register("/heatline/sw.js",{scope:"/heatline/"}).catch(function(){});


// ---------- season data (meets of the nation + which meets each swimmer swam) ----------
var nation=LS.get("nation",null)||(lang==="es"?"ESP":"POR"), NAT=null, HIST={}, histBusy=false, MIN=null;
function loadNat(){
  return fetch("/heatline/data/"+nation+".json",{cache:"no-cache"}).then(function(r){return r.json()}).then(function(j){NAT=j;renderMeetList();renderCal();loadHist();}).catch(function(){NAT={meets:[],idx:{}};renderCal()});
}
function natMeet(id){return NAT&&NAT.meets.find(function(m){return m.id===id})}
function dShort(f,to){try{var a=new Date(f+"T12:00:00"),o={day:"numeric",month:"short"};var s=a.toLocaleDateString(LOC[lang],o);if(to&&to!==f)s+="–"+new Date(to+"T12:00:00").toLocaleDateString(LOC[lang],o);return s}catch(e){return f}}
function dY(d){try{return new Date(d+"T12:00:00").toLocaleDateString(LOC[lang],{day:"numeric",month:"short",year:"numeric"})}catch(e){return d}}
var CAL=null;
function loadCal(){ fetch("/heatline/data/cal-"+nation+".json",{cache:"no-cache"}).then(function(r){return r.ok?r.json():null}).then(function(j){CAL=j;renderChamp()}).catch(function(){CAL=null;renderChamp()}); }
function renderChamp(){
  if(!CAL){$("champCard").hidden=true;return}
  var td=today(), cats={}; swimmers.forEach(function(s){var c=catOf(s); if(c) cats[c.id.split("_")[0].replace(/[AB]$|1$/,"")]=c.label.split(" ·")[0]; });
  var keys=Object.keys(cats);
  var L=CAL.items.filter(function(x){return (x.to||x.date)>=td && (!keys.length||!x.cats||x.cats.some(function(c){return keys.indexOf(c)>=0}))});
  $("champCard").hidden=false;
  $("champNote").textContent=keys.length?t("champFor")+" "+keys.map(function(k){return cats[k]}).join(", ")+".":"";
  $("champList").innerHTML=L.map(function(x){var days=Math.round((new Date(x.date+"T12:00:00")-new Date(td+"T12:00:00"))/864e5);
    return "<div class='d'"+(x.dl?" style='color:var(--bad)'":"")+">"+esc(dShort(x.date,x.to))+"<div class='small muted' style='font-weight:500'>"+esc(dY(x.date).slice(-4))+"</div></div><div><b"+(x.dl?" style='color:var(--bad)'":"")+">"+esc(x.name)+"</b><div class='small muted'>"+esc([x.org,x.note,days>0?t("inDays").replace("{n}",days):""].filter(Boolean).join(" · "))+"</div></div>"}).join("");
}
function renderCal(){
  document.querySelectorAll("#natSeg button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.nat===nation))});
  if(!NAT){$("calList").innerHTML="<p class='muted'>…</p>";return}
  var td=today(), L=NAT.meets.filter(function(m){return m.to>=td}).sort(function(a,b){return a.from.localeCompare(b.from)});
  renderChamp();
  $("calList").innerHTML=L.length?L.map(function(m){var on=m.id===meetId;
    return "<div class='d'>"+esc(dShort(m.from,m.to))+"</div><div><b>"+esc(m.name)+"</b><div class='small muted'>"+esc([m.city,m.course].filter(Boolean).join(" · "))+"</div><button class='btn "+(on?"":"ghost ")+"small' style='margin-top:6px' type='button' data-follow='"+esc(m.id)+"'>"+esc(on?t("following")+" ✓":t("follow"))+"</button></div>"}).join(""):"<p class='muted'>"+esc(t("calNone"))+"</p>";
}
$("calList").addEventListener("click",function(e){var b=e.target.closest("[data-follow]");if(!b)return;var m=natMeet(b.dataset.follow);
  if(m&&!meets.some(function(x){return x.id===m.id})){meets.push({id:m.id,name:m.name,city:m.city,date:m.from});LS.set("meets",meets)}
  setMeet(b.dataset.follow); renderCal(); showTab("live");});
$("natSeg").addEventListener("click",function(e){var b=e.target.closest("[data-nat]");if(!b)return;nation=b.dataset.nat;LS.set("nation",nation);NAT=null;CAL=null;renderCal();loadNat();loadCal();loadMin()});

// Results of the season: one request per meet the swimmer swam in; finished meets are kept on the phone.
function loadHist(){
  if(!NAT||!swimmers.length){renderRes();return}
  var want={}; swimmers.forEach(function(s){(NAT.idx[s.lic]||[]).forEach(function(id){(want[id]=want[id]||[]).push(s.lic)})});
  var ids=Object.keys(want), cache=LS.get("hist",{}), todo=[];
  ids.forEach(function(id){var c=cache[id], lics=want[id].join(",");
    if(c&&c.lics===lics){HIST[id]=c.data}else todo.push({id:id,lics:lics})});
  Object.keys(HIST).forEach(function(id){if(!want[id])delete HIST[id]});
  renderRes(); if(!todo.length) return;
  histBusy=true; renderRes();
  var i=0; function next(){ if(i>=todo.length){histBusy=false;renderRes();renderMin();return}
    var x=todo[i++]; fetch("/heatline/api/meet?id="+x.id+"&lic="+encodeURIComponent(x.lics)).then(function(r){return r.json()}).then(function(j){
      HIST[x.id]=j; if((NAT.done||[]).indexOf(x.id)>=0){var c=LS.get("hist",{});c[x.id]={lics:x.lics,data:j};LS.set("hist",c)}
    }).catch(function(){}).then(next); }
  next(); next();
}
// every individual result of a swimmer: season meets + the meet being followed
function allRes(lic){
  var out=[], seen={};
  function add(id,J){ if(!J||!J.swimmers||!J.swimmers[lic]||seen[id]) return; seen[id]=1; var nm=natMeet(id)||{};
    (J.swimmers[lic].results||[]).forEach(function(r){ var e=(J.events||{})[r.n]||{}; out.push(Object.assign({},r,{meetId:id,ev:e,pool:J.meet.pool||nm.course||"",date:e.date||nm.from||J.meet.date||"",meet:J.meet.name||nm.name||"",city:J.meet.city||nm.city||""})); }); }
  if(DATA&&DATA.available) add(DATA.id,DATA);
  Object.keys(HIST).forEach(function(id){add(id,HIST[id])});
  return out;
}
function bestKey(r){return r.ev.s+"|"+r.ev.d+"|"+r.pool}
function bests(lic){ var b={}; allRes(lic).forEach(function(r){ if(r.relay||r.st||!r.time||!r.ev.d) return; var k=bestKey(r); if(!b[k]||r.time<b[k].time) b[k]=r; }); return b; }
var SORD={FREE:1,BACK:2,BREAST:3,FLY:4,MEDLEY:5};
function renderRes(){
  if(!swimmers.length){$("resBox").innerHTML="<div class='card'><p class='muted' style='margin:0'>"+esc(t("pickFirst"))+"</p></div>";return}
  $("resBox").innerHTML=swimmers.map(function(s){
    var R=allRes(s.lic), B=bests(s.lic);
    var h="<div class='card'><h2>"+esc(s.name)+"</h2><div class='small muted'>"+esc([s.year?t("born")+" "+s.year:"",s.club].filter(Boolean).join(" · "))+"</div>";
    if(!R.length){h+="<p class='muted small' style='margin:10px 0 0'>"+esc(histBusy?t("resLoading"):t("resNone"))+"</p></div>";return h}
    var keys=Object.keys(B).sort(function(a,b){var x=B[a].ev,y=B[b].ev;return (SORD[x.s]||9)-(SORD[y.s]||9)||x.d-y.d||B[a].pool.localeCompare(B[b].pool)});
    h+="<h3 class='mh'>"+esc(t("best"))+"</h3><div class='tbl'><table><thead><tr><th></th><th>"+esc(t("pool"))+"</th><th>"+esc(t("bestT"))+"</th></tr></thead><tbody>"+keys.map(function(k){var r=B[k];return "<tr><td><b>"+esc(evName(r.ev))+"</b><div class='small muted'>"+esc(r.city)+" · "+esc(dShort(r.date))+"</div></td><td>"+esc(r.pool)+"</td><td><b>"+fmt(r.time)+"</b></td></tr>"}).join("")+"</tbody></table></div>";
    var by={}; R.forEach(function(r){(by[r.meetId]=by[r.meetId]||[]).push(r)});
    var ms=Object.keys(by).sort(function(a,b){return (by[b][0].date||"").localeCompare(by[a][0].date||"")});
    h+="<h3 class='mh'>"+esc(t("season"))+"</h3>";
    ms.forEach(function(id){var L=by[id].sort(function(a,b){return a.n-b.n});
      h+="<div style='margin-top:10px'><b>"+esc(L[0].meet)+"</b><div class='small muted'>"+esc(L[0].city)+" · "+esc(dShort(L[0].date))+" · "+esc(L[0].pool)+"</div>";
      L.forEach(function(r){var isPB=!r.relay&&!r.st&&r.time&&B[bestKey(r)]===r;
        var right=r.st?"<span class='badge b-bad'>"+esc(stTxt(r.st))+"</span>":"<div class='t' style='font-size:19px'>"+fmt(r.time)+"</div>";
        var sub=[r.place&&!r.st?t("ord")(r.place)+" "+t("place"):"", r.relay?(r.team||"")+" · "+r.leg+".º "+t("leg")+(r.legTime?": "+fmt(r.legTime):""):"", r.pts?r.pts+" "+t("pts"):""].filter(Boolean).join(" · ");
        h+="<div class='ev'><div class='nm'>"+esc((r.relay?t("relay")+" ":"")+evName(r.ev))+(isPB?"<span class='pb'>"+esc(t("pbTag"))+"</span>":"")+"</div><div>"+right+"</div>"+(sub?"<div class='sub'>"+esc(sub)+"</div>":"")+"</div>";});
      h+="</div>";});
    h+="<p class='small muted' style='margin:12px 0 0'>"+esc(t("rpNote"))+"</p></div>";
    return h;
  }).join("");
}

// ---------- standards (federation qualifying times) ----------
function loadMin(){ return fetch("/heatline/data/min-"+nation+".json",{cache:"no-cache"}).then(function(r){return r.ok?r.json():null}).then(function(j){MIN=j;renderMin()}).catch(function(){MIN=null;renderMin()}); }
function catOf(s){
  if(!MIN) return null; var g=s.g||"";
  return MIN.cats.find(function(c){return c.g===g && c.years.indexOf(+s.year)>=0}) || null;
}
function renderMin(){
  if(!swimmers.length){$("minBox").innerHTML="<div class='card'><p class='muted' style='margin:0'>"+esc(t("pickFirst"))+"</p></div>";return}
  $("minBox").innerHTML=swimmers.map(function(s){
    var h="<div class='card'><h2>"+esc(s.name)+"</h2>";
    if(!MIN) return h+"<p class='muted small' style='margin:8px 0 0'>"+esc(t("minSoon"))+"</p></div>";
    var c=catOf(s);
    if(!c) return h+"<p class='muted small' style='margin:8px 0 0'>"+esc(s.g?t("minSoon"):t("minNoCat"))+"</p></div>";
    h+="<div class='small muted'>"+esc(t("minCat"))+": <b>"+esc(c.label)+"</b></div>";
    var R=allRes(s.lic), rows=MIN.times[c.id]||[], C=c.cols;
    function bestIn(x,w){var b=null;R.forEach(function(r){if(r.relay||r.st||!r.time)return;if(r.ev.s!==x.s||r.ev.d!==x.d||r.pool!==x.pool)return;if(w&&(r.date<w.from||r.date>w.to))return;if(!b||r.time<b.time)b=r});return b}
    ["25m","50m"].forEach(function(pool){
      var rr=rows.filter(function(x){return x.pool===pool}); if(!rr.length) return;
      h+="<h3 class='mh'>"+esc(t("pool"))+" "+pool+"</h3><div class='tbl'><table><thead><tr><th></th><th>"+esc(t("bestT"))+"</th>"+C.map(function(col){return "<th>"+esc(col.label)+"</th>"}).join("")+"</tr></thead><tbody>";
      rr.forEach(function(x){
        var any=bestIn(x,null);
        h+="<tr><td><b>"+esc(evName(x))+"</b></td><td>"+(any?"<b>"+fmt(any.time)+"</b>":"<span class='muted'>—</span>")+"</td>"+C.map(function(col){
          var min=x.v[col.k]; if(min==null) return "<td class='muted'>—</td>";
          var b=bestIn(x,col), top="<div>"+fmt(min)+"</div>";
          if(!b) return "<td>"+top+"</td>";
          var g=Math.round((b.time-min)*100)/100;
          return "<td>"+top+(g<=0?"<span class='badge b-ok'>"+esc(t("minDone"))+"</span>":"<div class='small "+(g<1?"near":"muted")+"'>"+esc(t("minMiss"))+" "+g.toFixed(2)+"</div>")+"</td>";
        }).join("")+"</tr>";
      });
      h+="</tbody></table></div>";
    });
    h+="<p class='small muted' style='margin:10px 0 0'>"+C.map(function(col){return "<b>"+esc(col.label)+"</b> ("+esc(col.where)+"): "+esc(t("minWin"))+" "+esc(dY(col.from))+" "+esc(t("to"))+" "+esc(dY(col.to))}).join(". ")+". "+esc(t("minNear"))+"<br>"+esc(MIN.source||"")+"</p></div>";
    return h;
  }).join("");
}

// ---------- tabs ----------
function showTab(id){
  document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===id))});
  ["live","res","min","cal"].forEach(function(x){$("tab-"+x).hidden=x!==id});
  LS.set("tab",id); window.scrollTo(0,0);
  if(id==="res") renderRes(); if(id==="min") renderMin(); if(id==="cal") renderCal();
}
$("tabs").addEventListener("click",function(e){var b=e.target.closest("[data-tab]");if(b)showTab(b.dataset.tab)});

// ---------- start ----------
applyLang();
showAdd(!swimmers.length,false);
showTab(swimmers.length?LS.get("tab","live"):"live");
load(); loadNat(); loadMin(); loadCal();
})();
</script>
</body>
</html>
